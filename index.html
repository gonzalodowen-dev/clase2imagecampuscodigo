<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CinePrep - Asistente completo de pre-producción cinematográfica con soporte multi-proyecto, colaboración y exportación PDF.">
  <title>CinePrep | Asistente de Pre-Producción Cinematográfica</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/modules.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  
  <!-- SheetJS for Excel (.xlsx, .xls, .csv) native parsing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <!-- html2pdf for PDF Dossier export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
  <div id="app">
    <!-- Mobile Menu Button -->
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Menu">☰</button>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
          <div class="logo-icon">🎬</div>
          <div class="logo-text">Cine<span>Prep</span></div>
        </div>
      </div>
      <nav class="sidebar-nav" id="sidebarNav">
        <div class="nav-section-label">General</div>
        <div class="nav-item active" data-module="dashboard">
          <span class="nav-icon">🎬</span>
          <span>Proyectos & Inicio</span>
        </div>

        <div class="nav-section-label">Desarrollo Creativo</div>
        <div class="nav-item" data-module="guion">
          <span class="nav-icon">📝</span>
          <span>Guion y Derivados</span>
        </div>
        <div class="nav-item" data-module="guion-tecnico">
          <span class="nav-icon">🎥</span>
          <span>Guion Técnico</span>
        </div>
        <div class="nav-item" data-module="storyboard">
          <span class="nav-icon">🖼️</span>
          <span>Storyboard</span>
        </div>
        <div class="nav-item" data-module="moodboard">
          <span class="nav-icon">🎨</span>
          <span>Moodboards</span>
        </div>

        <div class="nav-section-label">Producción</div>
        <div class="nav-item" data-module="plan-produccion">
          <span class="nav-icon">📋</span>
          <span>Plan de Producción</span>
        </div>
        <div class="nav-item" data-module="presupuesto">
          <span class="nav-icon">💰</span>
          <span>Presupuesto</span>
        </div>
        <div class="nav-item" data-module="casting">
          <span class="nav-icon">🎭</span>
          <span>Casting</span>
        </div>

        <div class="nav-section-label">Logística</div>
        <div class="nav-item" data-module="catering">
          <span class="nav-icon">🍽️</span>
          <span>Catering</span>
        </div>
        <div class="nav-item" data-module="traslados">
          <span class="nav-icon">🚗</span>
          <span>Traslados</span>
        </div>
        <div class="nav-item" data-module="plan-rodaje">
          <span class="nav-icon">📅</span>
          <span>Plan de Rodaje</span>
        </div>
        <div class="nav-item" data-module="contactos">
          <span class="nav-icon">📞</span>
          <span>Contactos & Crew</span>
        </div>
      </nav>

      <div style="padding: var(--space-md); border-top: 1px solid var(--border-subtle);">
        <button class="btn btn-primary btn-sm w-full mb-xs" id="btnInviteCollabSidebar" style="justify-content: center; gap: var(--space-sm);">
          <span>👥</span> Invitar Colaboradores
        </button>
        <button class="btn btn-secondary btn-sm w-full mb-xs" id="btnExportPDF" style="justify-content: center; gap: var(--space-sm);">
          <span>📄</span> Exportar Dossier PDF
        </button>
        <div class="flex gap-xs mt-xs">
          <button class="btn btn-ghost btn-sm w-full" id="btnExport" style="justify-content: center; font-size:0.8rem">
            <span>📤</span> Exp JSON
          </button>
          <button class="btn btn-ghost btn-sm w-full" id="btnImport" style="justify-content: center; font-size:0.8rem">
            <span>📥</span> Imp JSON
          </button>
        </div>
        <input type="file" id="importFile" accept="*/*" style="display:none">
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
      <!-- Content rendered by JS modules -->
    </main>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- Modal Container -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent"></div>
  </div>

  <!-- Hidden Container for PDF Export Generation -->
  <div id="pdfExportContainer" style="display:none;"></div>

  <!-- Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/guion.js"></script>
  <script src="js/guion-tecnico.js"></script>
  <script src="js/storyboard.js"></script>
  <script src="js/moodboard.js"></script>
  <script src="js/plan-produccion.js"></script>
  <script src="js/presupuesto.js"></script>
  <script src="js/casting.js"></script>
  <script src="js/catering.js"></script>
  <script src="js/traslados.js"></script>
  <script src="js/plan-rodaje.js"></script>
  <script src="js/contactos.js"></script>
  <script src="js/colaboradores.js"></script>
</body>
</html>
